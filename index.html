<script>
const ORDER = ['Claude', 'Claude WW3', 'GPT', 'Grok', 'DeepSeek', 'Muse', 'Gemini'];
window.aftOrder = ORDER;
window.aftColor = (p) => dash.colors[Math.max(0, ORDER.indexOf(p))];

dash.calc('counts', {
  inputs: ['trades', 'portfolios'],
  title: 'Trades per portfolio',
  description: 'Counts each portfolio\'s buys and sells in the trade log.',
  fn: (trades, portfolios) => portfolios.map(p => {
    const mine = trades.filter(t => t.portfolio === p.portfolio);
    return {
      portfolio: p.portfolio,
      buys: mine.filter(t => t.action === 'Buy').length,
      sells: mine.filter(t => t.action === 'Sell').length,
      trades: mine.length
    };
  })
});

dash.calc('gains', {
  inputs: ['trades', 'quotes'],
  title: 'Gain or loss vs. buy price',
  description: 'Open buys: latest close ÷ buy price − 1 (still moving). A buy later sold in the same portfolio, or a sell with a public buy price: sale price ÷ buy price − 1 (final).',
  fn: (trades, quotes) => trades.map(t => {
    if (t.action === 'Sell') {
      return { id: t.id, gain: t.entry_price ? t.price / t.entry_price - 1 : null, final: !!t.entry_price, status: t.entry_price ? 'Final' : 'Not public' };
    }
    const exit = trades.find(x => x.action === 'Sell' && x.ticker === t.ticker && x.portfolio === t.portfolio && x.date > t.date);
    if (exit) return { id: t.id, gain: t.price ? exit.price / t.price - 1 : null, final: true, status: 'Final' };
    const q = quotes.find(x => x.ticker === t.ticker);
    return { id: t.id, gain: q && t.price ? q.price / t.price - 1 : null, final: false, status: 'Open' };
  })
});

dash.calc('trade_pnl', {
  inputs: ['trades', 'quotes'],
  title: 'P&L since each trade',
  description: 'Buys: latest close ÷ buy price − 1. Sells: (sale price − latest close) ÷ sale price, so it is positive when the stock fell after the sale.',
  fn: (trades, quotes) => trades.map(t => {
    const q = quotes.find(x => x.ticker === t.ticker);
    const now = q ? q.price : null;
    let pnl = null;
    if (now != null && t.price) pnl = t.action === 'Buy' ? now / t.price - 1 : (t.price - now) / t.price;
    return { id: t.id, current: now, pnl };
  })
});

dash.calc('summary', {
  inputs: ['trades'],
  title: 'Trade log totals',
  description: 'Total trades, buys and sells, and the latest trade date.',
  fn: (trades) => [{
    trades: trades.length,
    buys: trades.filter(t => t.action === 'Buy').length,
    sells: trades.filter(t => t.action === 'Sell').length,
    latest: trades.map(t => t.date).sort().slice(-1)[0] || ''
  }]
});
</script>

<script>
const fmtPct = (v) => (v > 0 ? '+' : '') + d3.format('.1%')(v);
const fmtDate = (s) => d3.utcFormat('%b %-d')(new Date(s + 'T00:00:00Z'));
const fmtGain = (g) => (g > 0 ? '+' : g < 0 ? '−' : '') + d3.format('.1%')(Math.abs(g));
const gainRow = (id) => { const s = dash.data('gains'); return s.status === 'ok' ? s.data.find(x => x.id === id) || null : null; };
const gainOf = (id) => { const r = gainRow(id); return r ? r.gain : null; };
const fmtLong = (s) => d3.utcFormat('%b %-d, %Y')(new Date(s + 'T00:00:00Z'));

function drawUpdated() {
  const el = document.getElementById('updated-val');
  if (!el) return;
  const m = dash.data('meta');
  el.textContent = m.status === 'ok' && m.data.length ? fmtLong(m.data[0].updated) : '—';
}

function drawTiles() {
  const box = document.getElementById('portfolios');
  const p = dash.data('portfolios');
  const c = dash.data('counts');
  box.replaceChildren();
  if (p.status !== 'ok') {
    for (const name of window.aftOrder) {
      const t = document.createElement('div'); t.className = 'aft-tile';
      const n = document.createElement('div'); n.className = 'aft-name'; n.textContent = name;
      const big = document.createElement('div'); big.className = 'aft-big' + (p.status === 'error' ? '' : ' dash-skeleton');
      if (p.status === 'error') { big.className = 'aft-fail'; big.textContent = 'Failed to load'; } else big.textContent = '—';
      t.append(n, big); box.append(t);
    }
    return;
  }
  const counts = c.status === 'ok' ? c.data : [];
  for (const row of p.data) {
    const enc = encodeURIComponent(row.portfolio);
    const t = document.createElement('div'); t.className = 'aft-tile'; t.id = 'tile-' + row.portfolio.replace(/\W+/g, '-').toLowerCase();
    const n = document.createElement('div'); n.className = 'aft-name';
    const dot = document.createElement('span'); dot.className = 'aft-dot'; dot.style.background = window.aftColor(row.portfolio);
    const nm = document.createElement('span'); nm.dataset.source = 'portfolios'; nm.dataset.field = 'portfolio'; nm.dataset.where = 'portfolio=' + enc; nm.textContent = row.portfolio;
    n.append(dot, nm);
    const big = document.createElement('div'); big.className = 'aft-big';
    big.dataset.source = 'portfolios'; big.dataset.field = 'stat'; big.dataset.where = 'portfolio=' + enc;
    big.textContent = row.stat == null ? '—' : fmtPct(Number(row.stat));
    const lab = document.createElement('div'); lab.className = 'aft-cap';
    lab.dataset.source = 'portfolios'; lab.dataset.field = 'stat_label'; lab.dataset.where = 'portfolio=' + enc;
    lab.textContent = row.stat == null ? row.stat_label : row.stat_label + ' · as of ' + fmtDate(row.as_of);
    const moves = document.createElement('div'); moves.className = 'aft-moves';
    const cr = counts.find(x => x.portfolio === row.portfolio);
    if (cr) {
      const by = document.createElement('span'); by.className = 'aft-buy'; by.dataset.source = 'counts'; by.dataset.field = 'buys'; by.dataset.where = 'portfolio=' + enc; by.textContent = cr.buys + ' buys';
      const se = document.createElement('span'); se.className = 'aft-sell'; se.dataset.source = 'counts'; se.dataset.field = 'sells'; se.dataset.where = 'portfolio=' + enc; se.textContent = cr.sells + ' sells';
      moves.append(by, se);
    }
    const bench = document.createElement('div'); bench.className = 'aft-bench';
    if (row.stat != null && row.benchmark != null) {
      const vs = document.createElement('span');
      vs.dataset.source = 'portfolios'; vs.dataset.field = 'benchmark'; vs.dataset.where = 'portfolio=' + enc;
      vs.textContent = 'S&P 500 ' + fmtPct(Number(row.benchmark));
      const gap = Number(row.stat) - Number(row.benchmark);
      const edge = document.createElement('span'); edge.className = 'aft-edge ' + (gap >= 0 ? 'aft-up' : 'aft-down');
      edge.textContent = (gap >= 0 ? '+' : '−') + d3.format('.1f')(Math.abs(gap) * 100) + ' pts ' + (gap >= 0 ? 'ahead' : 'behind');
      bench.append(vs, edge);
    } else {
      bench.textContent = 'No S&P comparison posted';
    }
    t.append(n, big, lab, moves, bench);
    box.append(t);
  }
}


window.aftFilter = window.aftFilter || { sel: new Set(), q: '' };
function drawTable() {
  const body = document.getElementById('trade-body');
  const empty = document.getElementById('trade-empty');
  const chips = document.getElementById('chips');
  const d = dash.data('trades');
  body.replaceChildren();
  if (d.status !== 'ok') {
    const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 10;
    if (d.status === 'error') { td.className = 'aft-fail'; td.textContent = 'Failed to load'; } else { td.className = 'dash-skeleton'; td.textContent = '—'; }
    tr.append(td); body.append(tr); empty.hidden = true; return;
  }
  const qa = dash.data('quotes'); const qe = document.getElementById('quote-asof');
  if (qe) qe.textContent = qa.status === 'ok' && qa.data.length ? fmtLong(qa.data[0].as_of) : 'latest';
  const f = window.aftFilter;
  if (!f.sel) f.sel = new Set();
  const names = window.aftOrder.filter(n => d.data.some(t => t.portfolio === n));
  const chip = (label, pressed, onClick) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'aft-chip'; b.textContent = label;
    b.setAttribute('aria-pressed', String(pressed));
    b.addEventListener('click', onClick);
    return b;
  };
  chips.replaceChildren(
    chip('All', f.sel.size === 0, () => { f.sel.clear(); drawTable(); }),
    ...names.map(n => chip(n, f.sel.has(n), () => {
      if (f.sel.has(n)) f.sel.delete(n); else f.sel.add(n);
      drawTable();
    }))
  );
  const q = f.q.trim().toLowerCase();
  const rows = d.data
    .filter(t => f.sel.size === 0 || f.sel.has(t.portfolio))
    .filter(t => !q || (t.ticker + ' ' + t.company + ' ' + t.reason).toLowerCase().includes(q))
    .slice().sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id));
  for (const t of rows) {
    const tr = document.createElement('tr'); tr.dataset.key = t.id;
    const cell = (text, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; tr.append(td); return td; };
    cell(fmtDate(t.date));
    cell(t.portfolio);
    const a = cell(''); const pill = document.createElement('span'); pill.className = 'aft-pill ' + (t.action === 'Buy' ? 'aft-buy' : 'aft-sell'); pill.textContent = t.action; a.append(pill);
    cell(t.ticker, 'tk');
    cell(t.company, 'aft-hide');
    cell(t.size);
    cell(t.price == null ? '—' : d3.format('$,.2f')(Number(t.price)), 'r' + (/estimate/i.test(t.price_source || '') ? ' aft-estp' : ''));
    cell(t.price_source || '—', 'aft-psrc');
    const gr = gainRow(t.id);
    const g = gr ? gr.gain : null;
    if (g == null) cell(t.action === 'Sell' ? 'Not public' : '—', 'r aft-psrc');
    else if (gr.final) {
      const td = cell('', 'r');
      const b = document.createElement('span'); b.className = 'aft-final ' + (g >= 0 ? 'aft-up' : 'aft-down'); b.textContent = fmtGain(g);
      b.title = 'Final: the position was sold'; td.append(b);
    } else {
      const td = cell(fmtGain(g), 'r aft-gain ' + (g >= 0 ? 'aft-up' : 'aft-down'));
      td.title = 'Open: latest close vs. buy price';
    }
    cell(t.reason, 'aft-reason aft-hide');
    tr.tabIndex = 0; tr.setAttribute('aria-label', `${t.action} ${t.ticker}, ${t.portfolio}, open details`);
    body.append(tr);
  }
  empty.hidden = rows.length > 0;
}

const qInput = document.getElementById('q');
qInput.addEventListener('input', () => { window.aftFilter.q = qInput.value; drawTable(); });

document.getElementById('trade-body').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-key]'); if (tr) openTrade(tr.dataset.key);
});
document.getElementById('trade-body').addEventListener('keydown', (e) => {
  const tr = e.target.closest('tr[data-key]');
  if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openTrade(tr.dataset.key); }
});

window.aftView = window.aftView || { trade: null, focusRow: null };
function openTrade(id) {
  window.aftView.trade = id; window.aftView.focusRow = id;
  dash.setLink('trade-' + id);
  render();
  window.scrollTo(0, 0);
  const b = document.querySelector('#trade-view .aft-back'); if (b) b.focus();
}
function closeTrade() {
  const id = window.aftView.trade;
  window.aftView.trade = null;
  dash.setLink('log');
  render();
  const row = document.querySelector(`#trade-body tr[data-key="${CSS.escape(id || '')}"]`);
  if (row) { row.scrollIntoView({ block: 'center' }); row.focus(); }
}

function drawDetail() {
  const box = document.getElementById('trade-view');
  box.replaceChildren();
  const d = dash.data('trades');
  const id = window.aftView.trade;
  const back = document.createElement('button'); back.type = 'button'; back.className = 'aft-back'; back.textContent = '← All trades';
  back.addEventListener('click', closeTrade);
  box.append(back);
  if (d.status !== 'ok') {
    const ph = document.createElement('div');
    if (d.status === 'error') { ph.className = 'aft-fail'; ph.textContent = 'Failed to load'; } else { ph.className = 'dash-skeleton'; ph.textContent = '—'; }
    box.append(ph); return;
  }
  const t = d.data.find(r => r.id === id);
  if (!t) { const p = document.createElement('p'); p.className = 'aft-empty'; p.textContent = 'That trade is no longer in the log.'; box.append(p); return; }
  const where = 'id=' + encodeURIComponent(t.id);
  const mk = (tag, field, text, cls) => { const el = document.createElement(tag); if (cls) el.className = cls; el.dataset.source = 'trades'; el.dataset.field = field; el.dataset.where = where; el.textContent = text; return el; };

  // Title
  const head = document.createElement('div'); head.className = 'aft-dtitle';
  const pill = mk('span', 'action', t.action, 'aft-pill ' + (t.action === 'Buy' ? 'aft-buy' : 'aft-sell'));
  const h = mk('h1', 'ticker', t.ticker); h.id = 'trade-title';
  head.append(pill, h, mk('span', 'company', t.company, 'aft-dco'));
  box.append(head);
  box.append(mk('p', 'summary', t.summary || '', 'aft-dsum'));

  // Facts
  const facts = document.createElement('div'); facts.className = 'aft-facts'; facts.id = 'trade-facts';
  const fact = (label, field, text, subField, subText) => {
    const f = document.createElement('div'); f.className = 'aft-fact';
    const l = document.createElement('div'); l.className = 'aft-cap'; l.textContent = label;
    f.append(l, mk('div', field, text, 'v'));
    if (subField && subText) f.append(mk('div', subField, subText, 's'));
    facts.append(f);
  };
  fact('Portfolio', 'portfolio', t.portfolio);
  fact('Model', 'model', t.model);
  fact('Traded', 'date', fmtLong(t.date));
  fact('Posted', 'posted', t.posted ? fmtLong(t.posted) : '—');
  fact('Size', 'size', t.size);
  if (t.action === 'Sell') {
    const f = document.createElement('div'); f.className = 'aft-fact'; f.id = 'trade-bought';
    const l = document.createElement('div'); l.className = 'aft-cap'; l.textContent = 'Bought at';
    f.append(l, mk('div', 'entry_price', t.entry_price == null ? 'Not public' : d3.format('$,.2f')(Number(t.entry_price)), 'v'));
    if (t.entry_when) f.append(mk('div', 'entry_when', t.entry_when, 's'));
    facts.append(f);
  }
  fact(t.action === 'Buy' ? 'Bought at' : 'Sold at', 'price', t.price == null ? 'Not stated' : d3.format('$,.2f')(Number(t.price)), 'price_source', t.price_source);
  if (t.action === 'Sell') {
    const f = document.createElement('div'); f.className = 'aft-fact'; f.id = 'trade-gain';
    const l = document.createElement('div'); l.className = 'aft-cap'; l.textContent = 'Gain / loss';
    const g = gainOf(t.id);
    const v = document.createElement('div'); v.className = 'v' + (g == null ? '' : ' ' + (g >= 0 ? 'aft-up' : 'aft-down'));
    v.dataset.source = 'gains'; v.dataset.field = 'gain'; v.dataset.where = where;
    v.textContent = g == null ? 'Not public' : fmtGain(g);
    f.append(l, v);
    facts.append(f);
  }
  box.append(facts);
  if (t.price_note) box.append(mk('p', 'price_note', t.price_note, 'aft-pnote'));
  if (t.gain_basis) box.append(mk('p', 'gain_basis', t.gain_basis, 'aft-pnote'));

  // About the company
  const co = document.createElement('section'); co.className = 'aft-co'; co.id = 'trade-company';
  const ch = document.createElement('h2'); ch.textContent = 'About ' + t.company; co.append(ch);
  const cd = dash.data('companies');
  const c = cd.status === 'ok' ? cd.data.find(r => r.ticker === t.ticker) : null;
  if (cd.status === 'loading') { const k = document.createElement('p'); k.className = 'dash-skeleton'; k.textContent = '—'; co.append(k); }
  else if (cd.status !== 'ok') { const f = document.createElement('div'); f.className = 'aft-fail'; f.textContent = 'Failed to load'; co.append(f); }
  else if (!c) { const n = document.createElement('p'); n.className = 'none'; n.textContent = 'No company profile yet for ' + t.ticker + '.'; co.append(n); }
  else {
    const cw = 'ticker=' + encodeURIComponent(c.ticker);
    const cm = (tag, field, text, cls) => { const el = document.createElement(tag); if (cls) el.className = cls; el.dataset.source = 'companies'; el.dataset.field = field; el.dataset.where = cw; el.textContent = text; return el; };
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.append(cm('span', 'sector', c.sector), cm('span', 'hq', c.hq));
    co.append(meta);
    const blk = (title, field, text) => { const b = document.createElement('div'); const h3 = document.createElement('h3'); h3.textContent = title; b.append(h3, cm('p', field, text)); co.append(b); };
    blk('What it is', 'about', c.about);
    blk('How it makes money', 'revenue', c.revenue);
    const sb = document.createElement('div'); const sh = document.createElement('h3'); sh.textContent = 'Main businesses'; sb.append(sh);
    const segs = cm('div', 'segments', '', 'aft-segs');
    for (const part of String(c.segments || '').split(' · ').filter(Boolean)) { const chip = document.createElement('span'); chip.className = 'aft-seg'; chip.textContent = part; segs.append(chip); }
    sb.append(segs); co.append(sb);
    const ft = document.createElement('p'); ft.className = 'foot'; ft.textContent = 'General company background, not from the @aifinancelabs post.'; co.append(ft);
  }
  // Sections
  const secs = document.createElement('div'); secs.className = 'aft-secs';
  const sec = (id, title, field, text, wide, fallback) => {
    const s = document.createElement('section'); s.className = 'aft-sec' + (wide ? ' wide' : ''); s.id = id;
    const hh = document.createElement('h2'); hh.textContent = title; s.append(hh);
    if (text) s.append(mk('p', field, text));
    else { const p = document.createElement('p'); p.className = 'none'; p.textContent = fallback; s.append(p); }
    secs.append(s);
  };
  sec('trade-why', `Why ${t.model} made this trade`, 'thesis', t.thesis, true, 'The post gave no reasoning for this leg.');
  sec('trade-risk', 'What could go wrong', 'risk', t.risk, false, 'The post didn\'t name a risk for this trade.');
  sec('trade-watch', 'What to watch next', 'watch', t.watch, false, 'No upcoming date was mentioned.');
  {
    const s2 = document.createElement('section'); s2.className = 'aft-sec wide aft-now'; s2.id = 'trade-outcome';
    const hh = document.createElement('h2'); hh.textContent = 'How it has gone so far'; s2.append(hh);
    const pd = dash.data('trade_pnl');
    const r = pd.status === 'ok' ? pd.data.find(x => x.id === t.id) : null;
    if (pd.status === 'loading') { const k = document.createElement('p'); k.className = 'dash-skeleton'; k.textContent = '—'; s2.append(k); }
    else if (pd.status !== 'ok') { const f = document.createElement('div'); f.className = 'aft-fail'; f.textContent = 'Failed to load'; s2.append(f); }
    else {
      const row = document.createElement('div'); row.className = 'aft-nowrow';
      const pm = (field, text, cls) => { const el = document.createElement('div'); el.className = cls; el.dataset.source = 'trade_pnl'; el.dataset.field = field; el.dataset.where = where; el.textContent = text; return el; };
      const qd = dash.data('quotes');
      const q = qd.status === 'ok' ? qd.data.find(x => x.ticker === t.ticker) : null;
      const c1 = document.createElement('div'); const l1 = document.createElement('div'); l1.className = 'aft-cap'; l1.textContent = 'Current price' + (q ? ' (' + fmtLong(q.as_of) + ' close)' : '');
      c1.append(l1, pm('current', r && r.current != null ? d3.format('$,.2f')(r.current) : '—', 'aft-nowv'));
      const c2 = document.createElement('div'); const l2 = document.createElement('div'); l2.className = 'aft-cap'; l2.textContent = t.action === 'Buy' ? 'P&L since buy' : 'P&L since sale';
      const g = r ? r.pnl : null;
      c2.append(l2, pm('pnl', g == null ? '—' : fmtGain(g), 'aft-nowv' + (g == null ? '' : g >= 0 ? ' aft-up' : ' aft-down')));
      row.append(c1, c2); s2.append(row);
    }
    secs.append(s2);
  }
  box.append(secs);
  box.append(co);

  // Paired leg
  const pair = t.pair ? d.data.find(r => r.id === t.pair) : null;
  if (pair) {
    const s = document.createElement('section'); s.className = 'aft-sec'; s.id = 'trade-pair';
    const hh = document.createElement('h2'); hh.textContent = t.action === 'Sell' ? 'Where the money went' : 'Where the money came from'; s.append(hh);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'aft-pairbtn';
    const pp = document.createElement('span'); pp.className = 'aft-pill ' + (pair.action === 'Buy' ? 'aft-buy' : 'aft-sell'); pp.textContent = pair.action;
    const tk = document.createElement('b'); tk.textContent = pair.ticker;
    const co = document.createElement('span'); co.className = 'aft-dco'; co.textContent = pair.company + ' · ' + pair.size;
    const go = document.createElement('span'); go.className = 'aft-more'; go.style.marginLeft = 'auto'; go.textContent = 'Open →';
    btn.append(pp, tk, co, go);
    btn.addEventListener('click', () => openTrade(pair.id));
    s.append(btn);
    box.append(s);
  }

  // Source
  const src = document.createElement('p'); src.className = 'aft-src';
  const a = document.createElement('a'); a.href = t.post; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Read the original post on X';
  src.append('Source: ', a, '. Reasoning is summarized from the post. It isn\'t investment advice.');
  box.append(src);
}

function render() {
  const inDetail = !!window.aftView.trade;
  document.getElementById('list-view').hidden = inDetail;
  document.getElementById('trade-view').hidden = !inDetail;
  if (inDetail) drawDetail();
  else { drawUpdated(); drawTiles(); drawTable(); }
}

(function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('trade-')) window.aftView.trade = h.slice(6);
  else if (h) { const el = document.getElementById(h); if (el) setTimeout(() => el.scrollIntoView(), 0); }
})();

dash.onData(render);
</script>
